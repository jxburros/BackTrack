# BackTrack CI: build against the pinned ggml, run the unit tests and the
# end-to-end smoke test on Linux, macOS and Windows; then, on Linux, the
# training code's parity check, few-second toy drum and bass training runs, the
# performed-audio and augmentation checks, and the WebAssembly build checked against
# the native binary.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Fetches and verifies the pinned ggml commit (scripts/install-vendor.js).
      - name: Install ggml
        run: npm ci

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_CCACHE=OFF

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Locate binaries
        id: bin
        run: |
          for dir in build build/Release; do
            for ext in .exe ""; do  # .exe first: Git Bash also matches the bare name
              if [ -f "$dir/backtrack-surveil$ext" ]; then
                echo "surveil=$dir/backtrack-surveil$ext" >> "$GITHUB_OUTPUT"
                echo "tests=$dir/backtrack-tests$ext" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done
          done
          echo "::error::backtrack-surveil not found"; exit 1

      - name: Unit tests
        run: '"${{ steps.bin.outputs.tests }}"'

      - name: Smoke test
        run: python scripts/smoke-test.py "${{ steps.bin.outputs.surveil }}"

      - name: Keep the Linux binary for the training job
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: backtrack-surveil-linux
          path: build/backtrack-surveil
          retention-days: 1

  # training/: PyTorch and the binary must agree (front end and likelihoods),
  # and the pipeline must train, export and evaluate a model end to end.
  training:
    needs: build
    name: training (parity, toy model)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: backtrack-surveil-linux
          path: build

      - name: Install NumPy and CPU PyTorch
        run: |
          chmod +x build/backtrack-surveil
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Parity on the placeholder models
        run: python -m training.parity --binary build/backtrack-surveil --placeholders

      - name: Toy drum model (synthetic data, a few seconds of training)
        run: |
          python -m training.synth --out "$RUNNER_TEMP/synth" --songs 10 --seconds 8
          python -m training.train_drums --data "$RUNNER_TEMP/synth" --out "$RUNNER_TEMP/toy.gguf" \
            --epochs 2 --steps-per-epoch 8 --batch 8 --version 0.0.0-ci
          python -m training.parity --binary build/backtrack-surveil --model "$RUNNER_TEMP/toy.gguf"
          python -m training.evaluate --model "$RUNNER_TEMP/toy.gguf" --data "$RUNNER_TEMP/synth" --split all \
            --binary build/backtrack-surveil

      - name: Toy bass model (the synthetic songs' bass lines, a few seconds of training)
        run: |
          python -m training.train_pitched --data "$RUNNER_TEMP/synth" --stem bass --out "$RUNNER_TEMP/bass.gguf" \
            --epochs 2 --steps-per-epoch 8 --batch 8 --version 0.0.0-ci
          python -m training.parity --binary build/backtrack-surveil --model "$RUNNER_TEMP/bass.gguf"
          python -m training.evaluate --model "$RUNNER_TEMP/bass.gguf" --data "$RUNNER_TEMP/synth" --split all \
            --binary build/backtrack-surveil

      - name: Performed audio (shifted labels, accepted windows, resume; about 20 s)
        run: python -m training.check_performed --work "$RUNNER_TEMP/perf"

      - name: Degradation augmentation (labels in place, deterministic copies, noise levels, off unchanged; about 90 s)
        run: python -m training.check_augment --work "$RUNNER_TEMP/augment"

      - name: Chord and key labels and scores (a fraction of a second)
        run: python -m training.check_chords

  # wasm/: the WebAssembly build must give the native binary's notes.
  wasm:
    needs: build
    name: wasm (Emscripten, checked against native)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/download-artifact@v4
        with:
          name: backtrack-surveil-linux
          path: build

      - name: Install ggml and Emscripten
        run: |
          npm ci
          bash scripts/install-emsdk.sh "$RUNNER_TEMP/emsdk"

      - name: Build
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          emcmake cmake -B build-wasm -DCMAKE_BUILD_TYPE=Release
          cmake --build build-wasm -j 4
          ls -l build-wasm/surveil-core.wasm

      - name: Check against the native binary
        run: |
          chmod +x build/backtrack-surveil
          python3 scripts/make-test-audio.py test-audio
          node wasm/test.mjs build-wasm test-audio build/backtrack-surveil
