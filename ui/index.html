<!doctype html>
<html lang="en" data-app="" data-theme="xerox-riot">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BackTrack</title>
<script>
  // Before first paint: the server sets the app's theme; light mode (bt-theme) or ?theme= overrides it.
  (() => {
    const html = document.documentElement;
    html.dataset.appTheme = html.dataset.theme;
    let pick = '';
    try { pick = localStorage.getItem('bt-theme') || ''; } catch {}
    const q = new URLSearchParams(location.search).get('theme');
    if (q) pick = q;
    if (['xerox-riot', 'blast-zone', 'wiretap'].includes(pick)) html.dataset.theme = pick;
  })();
</script>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="backtrack.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<main class="page">
  <div class="topline">
    <span class="bt-label" id="health" role="status">CONNECTING</span>
    <span class="bt-caption" id="meta"></span>
    <button class="bt-btn bt-btn--ghost bt-btn--small" id="theme-toggle" type="button" aria-pressed="false">Light mode</button>
  </div>

  <div class="auth" id="auth" hidden>
    <label class="bt-field">
      <span class="bt-label">API key</span>
      <input class="bt-input" id="token" type="password" autocomplete="off" placeholder="the key the server was started with">
    </label>
  </div>

  <div id="view"></div>
</main>

<div class="bt-toast" id="toast" role="status" hidden></div>

<!-- Exactly one view is rendered, so a screen has exactly one shout or app title. -->
<template id="view-none">
  <section class="empty">
    <h1 class="bt-shout bt-toner bt-tilt-l2" id="empty-title">Nothing here yet.</h1>
    <p id="empty-line">This page has no view for this app yet.</p>
  </section>
</template>

<template id="view-surveil">
  <section class="bt-screen sv" aria-labelledby="sv-title">
    <header class="sv-head">
      <h1 class="bt-app-title" id="sv-title">SURVEIL</h1>
      <div class="sv-cam">
        <span class="bt-rec" id="rec" hidden>REC</span>
        <div class="bt-readout bt-muted" id="cam"></div>
      </div>
    </header>

    <label class="bt-dropzone bt-torn sv-drop" id="drop">
      <span id="drop-text">WAV / FLAC / MP3 — or click to pick</span>
      <input class="bt-sr-only" id="file" type="file" accept=".wav,.flac,.mp3,audio/wav,audio/x-wav,audio/flac,audio/mpeg">
    </label>

    <div class="sv-source" id="source-row" hidden>
      <div class="sv-wave-wrap" id="wave-wrap" title="Click to jump">
        <canvas class="sv-wave" id="wave" aria-hidden="true"></canvas>
        <span class="sv-playhead" id="wave-head" aria-hidden="true"></span>
      </div>
      <div class="sv-transport">
        <button class="bt-btn bt-btn--ghost bt-btn--small" id="play" type="button">[ Play ]</button>
        <span class="bt-readout" id="clock">00:00.0 / 00:00.0</span>
      </div>
      <audio id="player" preload="metadata"></audio>
    </div>

    <div class="sv-settings">
      <label class="bt-field">
        <span class="bt-label">Stem</span>
        <span class="bt-select"><select id="source"><option value="mix">mix</option></select></span>
      </label>
      <label class="bt-field">
        <span class="bt-label">Model</span>
        <span class="bt-select"><select id="model"><option value="">automatic</option></select></span>
      </label>
      <label class="bt-field">
        <span class="bt-label">Key</span>
        <input class="bt-input" id="key" placeholder="optional, e.g. A minor" autocomplete="off">
      </label>
      <label class="bt-field">
        <span class="bt-label">Tempo (BPM)</span>
        <input class="bt-input" id="tempo" type="number" min="20" max="400" step="0.1" placeholder="optional, e.g. 120">
      </label>
      <label class="bt-check">
        <input id="bends" type="checkbox">
        <span class="bt-label">Pitch bends</span>
      </label>
    </div>

    <div class="sv-run">
      <div class="sv-progress" id="progress-row" hidden>
        <div class="bt-progress" id="progress" role="progressbar" aria-label="Transcription progress"
             aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bt-progress__bar" id="progress-bar" style="width:0%"></div></div>
        <div class="bt-progress__meta" id="progress-meta">WAITING</div>
      </div>
      <div class="sv-run__actions">
        <button class="bt-btn bt-btn--ghost" id="cancel" type="button" hidden>Cancel</button>
        <button class="bt-btn bt-btn--ghost" id="go" type="button" disabled>[ Tap the line ]</button>
      </div>
    </div>

    <div class="sv-status" id="status" aria-live="polite"></div>

    <div class="sv-case" id="case">
      <div class="sv-empty" id="case-empty">
        <p class="bt-readout">NOTHING HERE YET.</p>
        <p>Drop a track to start.</p>
      </div>
      <div id="case-file" hidden>
        <div class="bt-readout" id="case-title">CASE FILE:</div>
        <div class="bt-readout bt-muted sv-subject" id="case-subject"></div>
        <p class="bt-label sv-warn" id="placeholder-note" hidden>Placeholder model: hand-set weights, no training. Expect rough notes.</p>
        <div class="sv-roll" id="roll-wrap">
          <canvas id="roll" tabindex="0" role="img" aria-describedby="legend"></canvas>
        </div>
        <div class="sv-legend">
          <p class="bt-caption" id="legend">
            <span class="sv-key sv-key--sure" aria-hidden="true"></span> confident (0.7 and up)
            <span class="sv-key sv-key--guess" aria-hidden="true"></span> guessing.
            Hover a note, or focus the roll and use the arrow keys, for its numbers.
          </p>
        </div>
        <p class="bt-readout sv-tip" id="tip" aria-live="polite"></p>
        <div class="sv-foot">
          <span class="bt-readout" id="summary"></span>
          <span class="bt-scrawl sv-scrawl" aria-hidden="true">bright = sure.</span>
          <span class="sv-foot__actions">
            <button class="bt-btn bt-btn--ghost bt-btn--small" id="dl-json" type="button">[ Export .json ]</button>
            <button class="bt-btn" id="dl-midi" type="button">Export .mid</button>
          </span>
        </div>
      </div>
    </div>
  </section>
</template>

<template id="view-explode">
  <section class="bt-panel ex" aria-labelledby="ex-title">
    <div class="bt-hazard" aria-hidden="true"></div>
    <div class="ex-body">
      <header class="ex-head">
        <h1 class="bt-app-title bt-toner" id="ex-title">EXPLODE</h1>
        <div class="ex-file">
          <div class="bt-label" id="ex-file-line">NO TRACK YET</div>
          <div class="bt-caption" id="ex-file-sub">stems sum back to the mix.</div>
        </div>
      </header>

      <label class="bt-dropzone bt-torn ex-drop" id="drop">
        <span id="drop-text">WAV / FLAC / MP3 — or click to pick</span>
        <input class="bt-sr-only" id="file" type="file" accept=".wav,.flac,.mp3,audio/wav,audio/x-wav,audio/flac,audio/mpeg">
      </label>

      <div class="ex-settings">
        <fieldset class="ex-stems-pick">
          <legend class="bt-label">Stems</legend>
          <div class="ex-checks" id="stem-picks"></div>
        </fieldset>
        <label class="bt-field">
          <span class="bt-label">Model</span>
          <span class="bt-select"><select id="model"></select></span>
        </label>
        <label class="bt-check">
          <input id="augment" type="checkbox">
          <span class="bt-label">Two passes (flip + swap)</span>
        </label>
      </div>
      <p class="bt-label ex-warn" id="placeholder-note" hidden>Placeholder model: masks from the stereo field and the sound's shape, no training. Expect rough stems.</p>

      <div class="ex-stems" id="stems" hidden></div>
      <div class="ex-transport" id="transport" hidden>
        <button class="bt-btn bt-btn--ghost bt-btn--small" id="play" type="button">[ Play ]</button>
        <span class="bt-readout" id="clock">00:00.0 / 00:00.0</span>
        <button class="bt-btn bt-btn--ghost bt-btn--small ex-save-all" id="save-all" type="button">[ Save all stems ]</button>
      </div>

      <div class="ex-run">
        <div class="ex-progress" id="progress-row" hidden>
          <div class="bt-progress" id="progress" role="progressbar" aria-label="Separation progress"
               aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bt-progress__bar" id="progress-bar" style="width:0%"></div></div>
          <div class="bt-progress__meta" id="progress-meta">WAITING</div>
        </div>
        <div class="ex-run__actions">
          <span class="bt-scrawl" aria-hidden="true">boom.</span>
          <button class="bt-btn bt-btn--ghost" id="cancel" type="button" hidden>Cancel</button>
          <button class="bt-btn bt-btn--detonate" id="go" type="button" disabled>Detonate</button>
        </div>
      </div>
      <div class="ex-status" id="status" aria-live="polite"></div>
    </div>
  </section>
</template>

<script src="waveform.js"></script>
<script src="app.js"></script>
</body>
</html>
