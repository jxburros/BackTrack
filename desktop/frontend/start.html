<!doctype html>
<html lang="en" data-theme="xerox-riot">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BackTrack</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="backtrack.css">
<link rel="stylesheet" href="desktop.css">
</head>
<body>
<!-- An app's window while its server starts; the window moves to the app's page once it answers. -->
<main class="start">
  <h1 class="bt-app-title bt-toner" id="title">BACKTRACK</h1>
  <p class="bt-label" id="state" role="status">STARTING</p>
  <p class="bt-error" id="error" hidden></p>
  <p class="bt-caption">runs on your machine. nothing leaves it.</p>
</main>
<script src="start.js"></script>
</body>
</html>
